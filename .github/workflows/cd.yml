on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Authenticate to Google Cloud
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: Use gcloud CLI
      run: 'gcloud info'

    - name: Build and push Docker image
      run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-502015/notely-ar-repo/notely:${{ github.sha }} --tag us-central1-docker.pkg.dev/notely-502015/notely-ar-repo/notely:latest .
